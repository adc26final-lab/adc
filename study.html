<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#E9EDEC">
<title>OSCE 공부</title>
<style>
  :root{
    color-scheme: light only; -webkit-text-size-adjust:100%;
    --ink:#12212B; --ink-soft:#4A5C66; --paper:#E9EDEC; --card:#FFFFFF;
    --teal:#0F6E6E; --teal-pale:#DCEAE8; --amber:#C46A16; --red:#A8322A; --rule:#C9D2D2;
    --serif: Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#E9EDEC}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans);
       font-size:16px; line-height:1.5; overscroll-behavior-y:none}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  select,textarea{font-family:inherit;font-size:16px;color:inherit}

  .wrap{max-width:640px;margin:0 auto;padding:22px 20px 40px;
        padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  .stage{display:none} .stage.on{display:block}
  h1{font-size:22px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
  p.lede{margin:0 0 20px;color:var(--ink-soft);font-size:14.5px}
  h2{font-size:15px;margin:24px 0 8px;font-weight:600;color:var(--ink-soft)}
  label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 5px}
  input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--rule);
                       border-radius:3px;background:var(--card);font-family:inherit;font-size:16px}
  select,textarea{width:100%;padding:11px 12px;border:1px solid var(--rule);
                  border-radius:3px;background:var(--card)}
  textarea{min-height:120px;font-size:14px}
  .note{font-size:13px;color:var(--ink-soft);margin-top:10px;line-height:1.5}
  .hide{display:none}
  input[type=file]{width:100%;padding:11px 12px;border:1px solid var(--rule);
                   border-radius:3px;background:var(--card);font-size:14px}
  .recbar{display:flex;gap:8px;margin-top:14px}
  .recbar button{flex:1;padding:12px;border:1px solid var(--rule);border-radius:3px;
                 background:var(--card);font-size:14px;color:var(--teal)}
  .recbar button.live{background:var(--red);color:#fff;border-color:var(--red)}
  .recbar button:disabled{opacity:.35}
  .err{background:#F6E4E2;border:1px solid var(--red);color:var(--red);
       padding:12px 14px;font-size:14px;margin:14px 0;border-radius:3px}

  .btn{display:block;width:100%;padding:15px;border-radius:3px;background:var(--ink);
       color:#fff;font-weight:600;text-align:center;margin-top:18px}
  .btn.ghost{background:none;color:var(--teal);border:1px solid var(--rule);font-weight:500}
  .btn:disabled{opacity:.4}

  /* 단계 목록 */
  .steps{margin:8px 0 0}
  .step{display:flex;gap:13px;align-items:flex-start;background:var(--card);
        border:1px solid var(--rule);padding:15px 16px;margin-bottom:9px;border-radius:3px}
  .step.done{background:var(--teal-pale);border-color:var(--teal)}
  .step.next{border-color:var(--ink);border-width:2px}
  .step .n{font-family:var(--serif);font-size:20px;line-height:1.1;width:24px;
           flex:none;color:var(--ink-soft)}
  .step.done .n::before{content:"✓";color:var(--teal)}
  .step.done .n{font-size:0}
  .step .t{font-weight:600;font-size:15px}
  .step .d{font-size:13.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45}

  /* 진행 막대 */
  #bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--rule);z-index:50}
  #barFill{height:100%;width:0%;background:var(--teal);transition:width .3s}

  /* 턴 */
  .turn{border-left:2px solid var(--rule);padding:3px 0 3px 13px;margin-bottom:15px}
  .turn.dr{border-left-color:var(--teal)}
  .turn .who{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:3px}
  .turn.dr .who{color:var(--teal)}
  .turn .en{font-size:16px;line-height:1.5}
  .turn .ko{font-size:14px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
  .turn.now{background:var(--card);margin-left:-10px;padding-left:23px;
            border-left-width:3px;border-radius:0 3px 3px 0}
  .turn.dim .en,.turn.dim .ko{opacity:.35}

  /* 카드 한 장 */
  .one{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--ink);
       padding:22px 20px;margin-top:6px;min-height:190px}
  .one .who{font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:12px}
  .one .ko{font-size:17px;line-height:1.55;font-weight:500}
  .one .en{font-family:var(--serif);font-size:18px;line-height:1.55;margin-top:16px;
           padding-top:15px;border-top:1px solid var(--rule)}
  .one .en.veil{filter:blur(7px);user-select:none}
  .counter{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;
           margin:14px 0 0;text-align:center}

  /* 스테이션 카드 */
  .cue{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--ink);
       padding:20px 18px;font-family:var(--serif);font-size:14.5px;line-height:1.5}
  .cue .ci{font-family:var(--sans);font-size:11px;letter-spacing:.09em;
           color:var(--ink-soft);margin-bottom:13px}
  .cue .who2{font-size:16px;font-weight:600;margin:0 0 3px}
  .cue .cc{font-style:italic;margin:0 0 14px}
  .cue .sec{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.05em;
            color:var(--teal);margin:12px 0 4px}
  .cue ul,.cue ol{margin:0;padding-left:18px} .cue li{margin-bottom:4px}
  .cue .tasklab{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.05em;
                margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--rule)}

  /* cue 회상 */
  .slot{background:var(--card);border:1px solid var(--rule);padding:13px 15px;
        margin-bottom:8px;border-radius:3px}
  .slot .body{font-size:15px;line-height:1.45}
  .slot .body.veil{filter:blur(7px)}
  .slot .probe{font-size:13px;color:var(--ink-soft);margin-top:6px}
  .slot .mk{display:flex;gap:8px;margin-top:11px}
  .slot .mk button{flex:1;padding:9px;border:1px solid var(--rule);border-radius:3px;
                   font-size:13.5px;color:var(--ink-soft);background:var(--paper)}
  .slot.got{background:var(--teal-pale);border-color:var(--teal)}
  .slot.miss{opacity:.6}

  /* 하단 조작 */
  .dock{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
        border-top:1px solid var(--rule);padding:11px 20px calc(11px + env(safe-area-inset-bottom));
        z-index:45}
  .dock .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
  .dock button{flex:1;padding:14px;border-radius:3px;background:var(--ink);color:#fff;
               font-weight:600;font-size:15px}
  .dock button.sec{background:var(--card);color:var(--teal);border:1px solid var(--rule);
                   font-weight:500}
  .dock button:disabled{opacity:.4}
  /* 모드 · 블록 */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .mode{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:13px 13px;text-align:left}
  .mode .t{font-weight:600;font-size:15px}
  .mode .d{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4}
  .mode:disabled{opacity:.4}
  .blk{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin-bottom:8px}
  .blk .hd{display:flex;gap:10px;align-items:baseline}
  .blk .nm{flex:1;font-weight:600;font-size:15px}
  .blk .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-soft)}
  .blk .todo{font-size:13.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
  .blk .rec{font-size:12.5px;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .blk .acts{display:flex;gap:8px;margin-top:10px}
  .blk .acts button{flex:1;padding:9px;border:1px solid var(--rule);border-radius:3px;font-size:13.5px;
                    color:var(--teal);background:var(--paper)}
  .ok{color:var(--teal);font-weight:600} .bad{color:var(--red);font-weight:600} .warnc{color:var(--amber);font-weight:600}
  .clockbox{position:sticky;top:3px;z-index:40;background:var(--paper);padding:8px 0 10px;
            border-bottom:1px solid var(--rule);margin-bottom:14px}
  .clockbox .row1{display:flex;align-items:baseline;gap:12px}
  .clockbox .big{font-family:var(--serif);font-size:40px;font-variant-numeric:tabular-nums;line-height:1}
  .clockbox .big.warn{color:var(--amber)} .clockbox .big.over{color:var(--red)}
  .clockbox .tgt{font-size:13.5px;color:var(--ink-soft)}
  .clockbox .bn{font-size:13px;color:var(--ink-soft);margin-top:4px}
  .seg{display:flex;gap:6px;margin:6px 0 4px}
  .seg button{flex:1;padding:8px 4px;border:1px solid var(--rule);border-radius:3px;font-size:13px;
              background:var(--card);color:var(--ink-soft)}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .keys{font-size:14.5px;line-height:1.5;margin:0;padding-left:18px}
  .keys li{margin-bottom:4px}
  .ms{background:#FFF4E5;border-left:3px solid var(--amber);padding:1px 4px}
  .turn .en.hid{color:var(--ink-soft);font-style:italic;font-size:14px}
  .bh{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--teal);margin:18px 0 8px}
  table.ans{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card)}
  table.ans th,table.ans td{border:1px solid var(--rule);padding:7px 8px;vertical-align:top;text-align:left}
  table.ans th{background:var(--teal-pale);font-weight:600;font-size:12.5px}
  table.ans td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
  table.ans .chk{display:flex;gap:6px;margin-top:6px}
  table.ans .chk button{flex:1;padding:6px 2px;border:1px solid var(--rule);border-radius:3px;font-size:12px;
                        background:var(--paper);color:var(--ink-soft)}
  table.ans .chk button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .flip{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin-bottom:8px}
  .flip .q{font-size:15px;font-weight:600}
  .flip .a{font-size:14.5px;margin-top:8px}
  .flip .a.veil{filter:blur(7px);user-select:none}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="bar"><div id="barFill"></div></div>
<div class="wrap">

<section id="s-home" class="stage on">
  <h1>OSCE 공부</h1>
  <p class="lede">한 케이스를 다섯 단계로 소화합니다. 하루 한 단계, 20분.</p>
  <div id="compat"></div>
  <p class="note" id="diag" style="background:var(--teal-pale);border-left:3px solid var(--teal);padding:9px 11px;margin:0 0 4px"></p>

  <label for="caseSel">케이스</label>
  <select id="caseSel"></select>

  <label for="rate">읽는 속도</label>
  <select id="rate">
    <option value="0.9">느리게</option>
    <option value="1.05">보통</option>
    <option value="1.2" selected>빠르게</option>
    <option value="1.35">아주 빠르게</option>
  </select>

  <label for="engine">3단계 정답 음성</label>
  <select id="engine">
    <option value="tts">브라우저 기본 — 무료</option>
    <option value="11">ElevenLabs — 크레딧 사용</option>
  </select>

  <div id="elBox" class="hide">
    <label for="elKey">ElevenLabs API 키</label>
    <input type="password" id="elKey" placeholder="계정 → Settings → API Keys" autocomplete="off">
    <button class="btn ghost" id="elLoad">목소리 불러오기</button>
    <div id="elVoiceWrap" class="hide">
      <label for="elVoice">목소리</label>
      <select id="elVoice"></select>
    </div>
    <p class="note">1·2단계는 재생량이 많아 항상 기본 음성을 씁니다. 3단계 확인 버튼에서만 쓰입니다.</p>
  </div>

  <h2>연습 모드</h2>
  <div class="modes" id="modes"></div>
  <p class="note" id="modeNote"></p>

  <h2>대본 단계</h2>
  <div class="steps" id="steps"></div>

  <button class="btn ghost" id="reset">이 케이스 진도 초기화</button>
  <button class="btn ghost" id="openImport">케이스 불러오기</button>
  <div id="importBox" class="hide">
    <label for="pickFiles">JSON 파일 고르기</label>
    <input type="file" id="pickFiles" accept=".json,application/json" multiple>
    <p class="note">여러 개를 한 번에 고를 수 있습니다. cases.json 묶음도 됩니다.</p>

    <label for="importJson">또는 붙여넣기</label>
    <textarea id="importJson" placeholder='cases.json 내용을 붙여넣으세요'></textarea>
    <button class="btn ghost" id="doImport">추가</button>
  </div>
</section>

<section id="s-run" class="stage">
  <h1 id="runTitle"></h1>
  <p class="lede" id="runHow"></p>
  <div id="runBody"></div>
</section>

</div>

<div class="dock hide" id="dock"><div class="in" id="dockIn"></div></div>

<script>
"use strict";
const BUILTIN = [];   // 케이스는 코드에 넣지 않는다. 각자 "케이스 불러오기"로 자기 폰에만 저장한다.


const STEPS = [
  { id:0, t:"듣기만 하기",      d:"대화를 끝까지 듣습니다. 따라 하지 말고 흐름만 익히세요.",
    how:"재생을 누르고 듣기만 하세요. 눈으로는 영어와 한국어를 같이 따라갑니다." },
  { id:1, t:"따라 읽기",        d:"Dentist 대사를 소리 내어 따라 읽습니다.",
    how:"한 줄 듣고 똑같이 소리 내어 읽으세요. 녹음해서 비교하면 더 좋습니다." },
  { id:2, t:"한국어 → 영어",    d:"한국어만 보고 영어로 말합니다.",
    how:"한국어를 보고 영어로 말하세요. 녹음해두면 정답과 나란히 들어볼 수 있습니다." },
  { id:3, t:"Cue 떠올리기",     d:"큐카드만 보고 물어야 할 8가지를 떠올립니다.",
    how:"카드를 읽고, 무엇을 물어야 할지 하나씩 말해보세요. 그다음 열어서 맞춰봅니다." },
  { id:4, t:"롤플레이",         d:"실전처럼 10분 스테이션을 돕니다.",
    how:"" }
];

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const S = { metas:[], kase:null, step:0, i:0, playing:false, veil:true };

const PFX = "osce.";   // 케이스는 롤플레이 앱과 같은 곳에 둔다 (같은 주소라 공유됨)
const store = {
  idx(){
    try{
      const v = JSON.parse(localStorage.getItem(PFX+"index")||"[]");
      return v.map(x => typeof x === "string" ? { id:x, title:x } : x);   // 예전 형식도 읽는다
    }catch(e){ return []; }
  },
  meta(c){
    return { id:c.id, title:c.title||c.id, code:c.code||"",
             module:c.module||99, moduleName:c.moduleName||"", moduleColor:c.moduleColor||"" };
  },
  load(id){                            // 고른 케이스 하나만 펼친다
    try{ const raw = localStorage.getItem(PFX+"c."+id); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  },
  addPacks(list){
    const ids = store.idx();
    let n = 0;
    for(const c of list){
      try{ localStorage.setItem(PFX+"c."+c.id, JSON.stringify(c)); }
      catch(e){
        try{ localStorage.setItem(PFX+"index", JSON.stringify(ids)); }catch(e2){}
        throw new Error("저장 공간이 찼습니다. "+n+"개까지 들어갔습니다. 나머지는 나눠서 넣으세요.");
      }
      const at = ids.findIndex(x => x.id === c.id);
      if(at < 0) ids.push(store.meta(c)); else ids[at] = store.meta(c);
      n++;
    }
    localStorage.setItem(PFX+"index", JSON.stringify(ids));
    return n;
  },
  clearPacks(){
    for(const m of store.idx()){ try{ localStorage.removeItem(PFX+"c."+m.id); }catch(e){} }
    try{ localStorage.removeItem(PFX+"index"); }catch(e){}
  },
  get rate(){ try{ return parseFloat(localStorage.getItem("study.rate"))||1.2; }catch(e){ return 1.2; } },
  set rate(v){ try{ localStorage.setItem("study.rate", v); }catch(e){} },
  get eng(){ try{ return localStorage.getItem("study.engine")||"tts"; }catch(e){ return "tts"; } },
  set eng(v){ try{ localStorage.setItem("study.engine", v); }catch(e){} },
  get elk(){ try{ return localStorage.getItem("osce.elkey")||""; }catch(e){ return ""; } },
  set elk(v){ try{ localStorage.setItem("osce.elkey", v); }catch(e){} },
  get elv(){ try{ return localStorage.getItem("osce.elvoice")||""; }catch(e){ return ""; } },
  set elv(v){ try{ localStorage.setItem("osce.elvoice", v); }catch(e){} },
  get elvn(){ try{ return localStorage.getItem("osce.elvname")||""; }catch(e){ return ""; } },
  set elvn(v){ try{ localStorage.setItem("osce.elvname", v); }catch(e){} },
  prog(id){ try{ return parseInt(localStorage.getItem("study.p."+id)||"0",10); }catch(e){ return 0; } },
  setProg(id,v){ try{ localStorage.setItem("study.p."+id, String(v)); }catch(e){} }
};

/* ── 음성 ── */
const canSpeak = "speechSynthesis" in window;
let voiceCache = null;
function voicesReady(){
  return new Promise(res => {
    if(!canSpeak) return res([]);
    const now = speechSynthesis.getVoices();
    if(now && now.length) return res(now);
    let done=false; const fin=()=>{ if(!done){done=true;res(speechSynthesis.getVoices()||[]);} };
    speechSynthesis.onvoiceschanged = fin; setTimeout(fin, 1500);
  });
}
function pickVoice(vs){
  return vs.find(v=>v.lang&&v.lang.replace("_","-").startsWith("en-AU"))
      || vs.find(v=>v.lang&&v.lang.replace("_","-").startsWith("en-GB"))
      || vs.find(v=>v.lang&&v.lang.startsWith("en")) || null;
}
/* 크롬(안드로이드)은 긴 문장을 15초쯤에서 끊는다. 짧게 잘라 이어 읽는다. */
function chunkText(text, max){
  max = max || 170;
  const out = [];
  let rest = String(text).trim();
  while(rest.length > max){
    let cut = -1;
    for(const mark of [". ", "? ", "! ", "; ", ", "]){
      const at = rest.lastIndexOf(mark, max);
      if(at > cut) cut = at + mark.length;
    }
    if(cut <= 0) cut = rest.lastIndexOf(" ", max);
    if(cut <= 0) cut = max;
    out.push(rest.slice(0, cut).trim());
    rest = rest.slice(cut).trim();
  }
  if(rest) out.push(rest);
  return out;
}

let keepAlive = null;
function startKeepAlive(){          // 크롬이 도중에 멈추는 걸 막는다
  stopKeepAlive();
  keepAlive = setInterval(() => {
    if(speechSynthesis.speaking && !speechSynthesis.paused){
      speechSynthesis.pause(); speechSynthesis.resume();
    }
  }, 9000);
}
function stopKeepAlive(){ if(keepAlive){ clearInterval(keepAlive); keepAlive = null; } }

function speak(text, onEnd){
  if(!canSpeak || !text){ onEnd && onEnd(); return; }
  speechSynthesis.cancel();
  const parts = chunkText(text);
  let i = 0;
  startKeepAlive();

  const next = () => {
    if(i >= parts.length){ stopKeepAlive(); onEnd && onEnd(); return; }
    const u = new SpeechSynthesisUtterance(parts[i++]);
    u.lang = "en-AU"; if(voiceCache) u.voice = voiceCache;
    u.rate = store.rate; u.pitch = 1.0;
    let moved = false;
    const go = () => { if(!moved){ moved = true; next(); } };
    u.onend = go;
    u.onerror = go;
    speechSynthesis.speak(u);
    // 끝 신호가 안 오는 경우를 대비한 보험
    const guess = Math.max(3000, (parts[i-1].length / 12) * 1000 / (store.rate || 1) + 2500);
    setTimeout(() => { if(!speechSynthesis.speaking) go(); }, guess);
  };
  next();
}
function stopSpeak(){
  stopKeepAlive();
  if(canSpeak) speechSynthesis.cancel();
  if(elAudio){ try{ elAudio.pause(); }catch(e){} }
}

let elAudio = null, elWarned = false;

async function elevenPlay(text){
  const key = store.elk, vid = store.elv;
  if(!key || !vid) throw new Error("ElevenLabs 설정이 비어 있습니다.");
  const res = await fetch(
    "https://api.elevenlabs.io/v1/text-to-speech/" + encodeURIComponent(vid),
    { method:"POST",
      headers:{ "xi-api-key":key, "content-type":"application/json", "accept":"audio/mpeg" },
      body: JSON.stringify({ text: text, model_id:"eleven_turbo_v2_5",
        voice_settings:{ stability:0.4, similarity_boost:0.75, style:0.35 } }) });
  if(!res.ok){
    if(res.status === 401) throw new Error("ElevenLabs 키가 거부됐습니다.");
    if(res.status === 429) throw new Error("ElevenLabs 크레딧이 부족합니다.");
    throw new Error("ElevenLabs 오류 " + res.status);
  }
  const url = URL.createObjectURL(await res.blob());
  if(elAudio){ try{ elAudio.pause(); }catch(e){} }
  elAudio = new Audio(url);
  elAudio.playbackRate = store.rate;
  elAudio.onended = () => URL.revokeObjectURL(url);
  await elAudio.play();
}

/* ── 녹음 ── */
const REC = { mr:null, chunks:[], url:null, on:false, stream:null };

function recMime(){
  const c = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", ""];
  for(const t of c){
    if(!t) return "";
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return "";
}

async function recStart(){
  if(!navigator.mediaDevices || !window.MediaRecorder)
    throw new Error("이 브라우저는 녹음을 지원하지 않습니다.");
  REC.stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  const mt = recMime();
  REC.mr = mt ? new MediaRecorder(REC.stream, { mimeType:mt })
              : new MediaRecorder(REC.stream);
  REC.chunks = [];
  REC.mr.ondataavailable = e => { if(e.data && e.data.size) REC.chunks.push(e.data); };
  REC.mr.start();
  REC.on = true;
}

function recStop(){
  return new Promise(res => {
    if(!REC.mr || REC.mr.state === "inactive"){ REC.on = false; return res(null); }
    REC.mr.onstop = () => {
      REC.on = false;
      if(REC.stream){ REC.stream.getTracks().forEach(t => t.stop()); REC.stream = null; }
      if(REC.url) URL.revokeObjectURL(REC.url);
      const blob = new Blob(REC.chunks, { type: REC.chunks[0] ? REC.chunks[0].type : "audio/mp4" });
      REC.url = URL.createObjectURL(blob);
      res(blob);
    };
    try{ REC.mr.stop(); }catch(e){ REC.on = false; res(null); }
  });
}

function recPlay(){
  if(!REC.url) return;
  stopSpeak();
  const a = new Audio(REC.url);
  a.play().catch(() => {});
}

/* 목차에 모듈 정보가 빠져 있으면 저장된 케이스를 읽어 다시 만든다 */
async function fetchVoices(key){
  const tries = [
    "https://api.elevenlabs.io/v2/voices?page_size=100",
    "https://api.elevenlabs.io/v1/voices"        // 구버전 — v2 가 400 이면 이쪽
  ];
  let last = "";
  for(const url of tries){
    let res;
    try{ res = await fetch(url, { headers:{ "xi-api-key": key } }); }
    catch(e){ last = "네트워크 오류"; continue; }
    if(res.ok){
      const vs = (await res.json()).voices || [];
      if(vs.length) return vs;
      last = "목소리가 하나도 없습니다.";
      continue;
    }
    if(res.status === 401){
      throw new Error("키가 거부됐습니다. 만료됐거나 Voices 읽기 권한이 없습니다.");
    }
    last = "오류 " + res.status;
  }
  throw new Error(last || "불러오지 못했습니다.");
}

function repairIndex(){
  const ids = store.idx();
  if(!ids.length) return 0;
  let fixed = 0;
  const rebuilt = ids.map(m => {
    const full = store.load(m.id);
    if(!full) return m;
    const nm = store.meta(full);
    if(nm.moduleName !== m.moduleName || nm.code !== m.code) fixed++;
    return nm;
  });
  try{ localStorage.setItem(PFX+"index", JSON.stringify(rebuilt)); }catch(e){}
  return fixed;
}

/* ── 블록 말하기: 진행 ── */
const R = { a:0, z:0, bi:0, ti:0, t0:0, off:0, bStart:0, run:false, timer:null, buzzed:false, splits:[], waitPt:false };
const now = () => R.run ? (Date.now() - R.t0)/1000 + R.off : 0;

function runBlock(a, z){
  stopSpeak();
  if(REC.url){ URL.revokeObjectURL(REC.url); REC.url = null; }
  Object.assign(R, { a:a, z:z, bi:a, ti:0, t0:0, off:0, bStart:0, run:false, buzzed:false, splits:[], waitPt:false });
  clearInterval(R.timer);
  const bs = blocks();
  $("runTitle").textContent = a === z ? CIRC[a]+" "+bs[a].name : CIRC[a]+" → "+CIRC[z]+" 이어서";
  drawBlock();
  dock([{ label:"목록", sec:true, go:stopBlock },
        { label:"시작", go:startBlock }]);
}
function startBlock(){
  R.run = true; R.t0 = Date.now();
  R.timer = setInterval(tickBlock, 200);
  if(opt.rec === "on") recStart().catch(e => alert(e.message || "녹음을 시작할 수 없습니다."));
  step();
}
function tickBlock(){
  const b = blocks()[R.bi], t = now() - R.bStart;
  const big = $("bClock");
  if(!big) return;
  big.textContent = mmss(t);
  big.className = "big " + (t > b.sec*1.1 ? "over" : (t > b.sec*0.9 ? "warn" : ""));
  if(t >= b.sec && !R.buzzed){ R.buzzed = true; try{ navigator.vibrate && navigator.vibrate(250); }catch(e){} }
  const tot = $("bTotal");
  if(tot) tot.textContent = mmss(now());
}
function clockHTML(){
  const bs = blocks(), b = bs[R.bi];
  let cum = 0; for(let i = R.a; i <= R.bi; i++) cum += bs[i].sec;
  return '<div class="clockbox"><div class="row1"><span class="big" id="bClock">'+mmss(now() - R.bStart)+"</span>" +
    '<span class="tgt">목표 '+mmss(b.sec)+" ("+Math.round(b.sec*0.9)+"~"+Math.round(b.sec*1.1)+"초)</span></div>" +
    '<div class="bn">'+CIRC[R.bi]+" "+esc(b.name) +
    (R.a !== R.z ? ' · 누적 <span id="bTotal">'+mmss(now())+"</span> / 이 블록 끝 "+mmss(cum) : "") +
    " · 시험 시계 ~"+esc(b.end)+"</div></div>";
}
function drawBlock(){
  const b = blocks()[R.bi], v = opt.view;
  let h = clockHTML();
  h += '<p class="note" style="margin-top:0"><b>할 일</b> '+esc(b.todo)+"</p>";
  if(v !== "all"){
    const ks = (b.key||[]).concat((b.mustsay||[]).filter(m => !(b.key||[]).includes(m)));
    if(ks.length) h += '<ul class="keys">' + ks.map(x =>
      "<li>"+((b.mustsay||[]).includes(x) ? '<span class="ms">'+esc(x)+"</span>" : esc(x))+"</li>").join("") + "</ul>";
  }
  if(v !== "todo"){
    h += '<div class="bh">대본</div>';
    h += b.turns.map((t,i) => {
      const dr = t.who === "dr", past = i < R.ti || !R.run, cur = R.run && i === R.ti;
      const hide = v === "key" && dr && !(R.run && i < R.ti);
      const ms = dr && (b.mustsay||[]).some(m => t.en.includes(m.split("?")[0]));
      return '<div class="turn '+(dr ? "dr" : "pt")+(cur ? " now" : (R.run && i > R.ti ? " dim" : ""))+'" id="bt'+i+'">' +
        '<div class="who">'+(dr ? "Dentist" : "Patient")+(ms ? " · must-say" : "")+"</div>" +
        (hide ? '<div class="en hid">— 내 차례 —</div>' : '<div class="en">'+esc(t.en)+"</div>") + "</div>";
    }).join("");
  }
  $("runBody").innerHTML = h;
  const e = $("bt"+R.ti); if(R.run && e) e.scrollIntoView({ block:"center" });
}
function runDock(){
  const b = blocks()[R.bi], t = b.turns[R.ti], free = opt.view === "todo";
  const last = free || R.ti >= b.turns.length-1;
  const btns = [{ label:"그만", sec:true, go:() => finishRun(true) }];
  if(!free && t && t.who === "pt") btns.push({ label:"다시 듣기", sec:true, go:() => speak(t.en, null) });
  btns.push({ label: last ? (R.bi < R.z ? "블록 끝 ▶" : "끝") : "다음 ▶",
              off: !free && t && t.who === "pt" && R.waitPt, go: advance });
  dock(btns);
}
function step(){
  const b = blocks()[R.bi];
  if(opt.view === "todo"){ drawBlock(); runDock(); return; }
  const t = b.turns[R.ti];
  if(!t){ blockDone(); return; }
  drawBlock();
  if(t.who === "pt"){
    if(opt.pt === "time"){
      R.off += wc(t.en) / P_WPS - 0.35;          // 아래 0.35초 대기를 빼 준다
      R.ti++; setTimeout(step, 350); return;
    }
    R.waitPt = true; runDock();
    speak(t.en, () => { if(!R.run || blocks()[R.bi] !== b || b.turns[R.ti] !== t) return;
                        R.waitPt = false; R.ti++; step(); });
    return;
  }
  runDock();
}
function advance(){
  if(!R.run) return;
  stopSpeak(); R.waitPt = false;
  if(opt.view === "todo"){ blockDone(); return; }
  R.ti++;
  if(R.ti >= blocks()[R.bi].turns.length) blockDone(); else step();
}
function blockDone(){
  const b = blocks()[R.bi], t = now();
  R.splits.push({ i:R.bi, sec:t - R.bStart });
  rec.addBlock(b.no, t - R.bStart);
  if(R.bi < R.z){
    R.bi++; R.ti = 0; R.bStart = t; R.buzzed = false;
    try{ navigator.vibrate && navigator.vibrate([80,60,80]); }catch(e){}
    step();
  } else finishRun(false);
}
async function finishRun(early){
  clearInterval(R.timer);
  stopSpeak();
  const total = now();
  R.run = false;
  if(REC.on) await recStop();
  const bs = blocks();
  let h = "";
  if(!R.splits.length){
    h = '<p class="lede">기록 없이 멈췄습니다.</p>';
  } else {
    h += '<table class="ans"><tr><th>블록</th><th>목표</th><th>걸린 시간</th><th>편차</th><th>판정</th></tr>';
    let tg = 0;
    h += R.splits.map(s => { const b = bs[s.i], j = judge(s.sec, b.sec); tg += b.sec;
      return "<tr><td>"+CIRC[s.i]+" "+esc(b.name)+'</td><td class="n">'+mmss(b.sec)+'</td><td class="n">'+mmss(s.sec)+
             '</td><td class="n">'+dev(s.sec, b.sec)+'</td><td class="'+j[0]+'">'+j[1]+"</td></tr>"; }).join("");
    if(R.splits.length > 1){
      const sum = R.splits.reduce((x,s) => x + s.sec, 0), j = judge(sum, tg);
      h += '<tr><td><b>합계</b></td><td class="n">'+mmss(tg)+'</td><td class="n">'+mmss(sum)+'</td><td class="n">'+
           dev(sum, tg)+'</td><td class="'+j[0]+'">'+j[1]+"</td></tr>";
    }
    h += "</table>";
    if(early) h += '<p class="note">중간에 멈춘 블록은 기록하지 않았습니다.</p>';
    if(opt.pt === "time") h += '<p class="note">환자 대사 시간 '+Math.round(R.off)+"초를 계산으로 더했습니다.</p>";
    const ms = [];
    R.splits.forEach(s => (bs[s.i].mustsay||[]).forEach(m => ms.push(m)));
    if(ms.length){
      h += '<div class="bh">꼭 말할 것 — 말했나요?</div>' + ms.map((m,i) =>
        '<div class="slot" id="ms'+i+'"><div class="body">'+esc(m)+'</div><div class="mk">' +
        '<button data-ms="'+i+'" data-v="1">말했음</button><button data-ms="'+i+'" data-v="0">놓침</button></div></div>').join("");
    }
  }
  if(REC.url) h += '<div class="recbar"><button id="recPlay">내 목소리 듣기</button></div>';
  $("runBody").innerHTML = h;
  document.querySelectorAll("[data-ms]").forEach(b => b.onclick = () => {
    const s = $("ms"+b.dataset.ms); s.classList.add(b.dataset.v === "1" ? "got" : "miss");
    s.querySelector(".mk").remove();
  });
  if($("recPlay")) $("recPlay").onclick = recPlay;
  dock([{ label:"목록", sec:true, go:() => { $("runTitle").textContent = "블록 말하기"; blockList(); } },
        { label:"다시", go:() => runBlock(R.a, R.z) }]);
  window.scrollTo(0,0);
}
function stopBlock(){
  clearInterval(R.timer); R.run = false; stopSpeak();
  $("runTitle").textContent = "블록 말하기";
  blockList();
}

    }finally{ btn.disabled = false; }
  };

  $("reset").onclick = () => { if(!S.kase) return; store.setProg(S.kase.id, 0); drawSteps(); };
  $("openImport").onclick = () => $("importBox").classList.toggle("hide");
  $("pickFiles").onchange = async (ev) => {
    const files = Array.from(ev.target.files || []);
    if(!files.length) return;
    let add = [], bad = [];
    for(const f of files){
      try{
        const v = JSON.parse(await f.text());
        (Array.isArray(v) ? v : [v]).forEach(c => {
          if(c && c.id) add.push(c); else bad.push(f.name);
        });
      }catch(e){ bad.push(f.name); }
    }
    ev.target.value = "";
    if(!add.length){ alert("읽을 수 있는 케이스가 없습니다."); return; }
    let n = 0;
    try{ n = store.addPacks(add); }
    catch(e){ loadCases(); pickCase(); alert(e.message); return; }
    loadCases(); pickCase();
    $("importBox").classList.add("hide");
    alert(n + "개 케이스를 넣었습니다." + (bad.length ? "  읽지 못한 파일: " + bad.join(", ") : ""));
  };

  $("doImport").onclick = () => {
    let add;
    try{
      const v = JSON.parse($("importJson").value);
      add = Array.isArray(v) ? v : [v];
      add.forEach(c => { if(!c.id) throw new Error("id 가 없는 항목이 있습니다."); });
    }catch(e){ alert("JSON을 읽지 못했습니다: " + e.message); return; }
    let n = 0;
    try{ n = store.addPacks(add); }
    catch(e){ loadCases(); pickCase(); alert(e.message); return; }
    loadCases(); pickCase();
    $("importJson").value = ""; $("importBox").classList.add("hide");
    alert(n + "개 케이스를 넣었습니다.");
  };
})();
</script>
</body>
</html>
